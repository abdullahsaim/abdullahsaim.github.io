function group(key){const m={};D.forEach(x=>{(key(x)).forEach(k=>{(m[k]=m[k]||[]).push(x)})});return Object.entries(m).map(([k,a])=>({k,a,min:a.reduce((s,x)=>s+x.dur,0),subs:[...new Set(a.map(x=>x.sub))],profs:[...new Set(a.flatMap(x=>x.p))],f:a[0].d,l:a[a.length-1].d})).sort((a,b)=>b.min-a.min)}
function list(a){return `<div class="ov"><table>${a.map(x=>`<tr><td>${fd(x.d)}</td><td>${tm(x)}</td><td><span class="tag" style="background:${col(x.sub)}">${lab(x)}</span></td><td>${x.p.join(' + ')}${x.p.length>1?' <span class="tag" style="background:var(--bd);color:var(--tx)">co-taught</span>':''}</td><td>${x.r}</td></tr>`).join('')}</table></div>`}
function groupView(g,sec){const mx=g[0].min;return g.map(o=>`<div class="c"><div class="row" style="cursor:pointer" onclick="st.open=st.open=='${o.k.replace(/'/g,"\\'")}'?null:'${o.k.replace(/'/g,"\\'")}';go()"><div class="n" style="width:230px"><b>${o.k}</b></div><div class="bar"><i style="width:${o.min/mx*100}%;background:${sec=='s'?col(o.k):'var(--ac)'}"></i></div><div class="v" style="width:150px">${hh(o.min)} · ${o.a.length} sess.</div></div><div class="mu" style="font-size:12px">${sec=='s'?(o.profs.join(', ')||'—'):(o.a.filter(x=>x.p.length>1).length?'Co-teaches '+o.a.filter(x=>x.p.length>1).length+' session(s) · ':'')+o.subs.join(', ')} · ${fd(o.f,{day:'numeric',month:'short'})} → ${fd(o.l,{day:'numeric',month:'short'})}</div>${st.open==o.k?list(o.a):''}</div>`).join('')}
function overview(){const tot=D.reduce((s,x)=>s+x.dur,0),nx=D.find(x=>x.d>=new Date().toISOString().slice(0,10)&&!x.ad);
const wd=[0,0,0,0,0];D.forEach(x=>{const i=(x.dt.getUTCDay()+6)%7;if(i<5)wd[i]+=x.dur});
const wh=weeks.map(w=>[fd(w,{day:'numeric',month:'short'}),D.filter(x=>mon(x.d)==w).reduce((s,x)=>s+x.dur,0)]);
const sg=group(x=>[x.sub]);
return `<div class="g"><div class="c"><div class="k">${D.length}</div><div class="l">Sessions</div></div><div class="c"><div class="k">${hh(tot)}</div><div class="l">Contact time</div></div><div class="c"><div class="k">${subs.length}</div><div class="l">Subjects</div></div><div class="c"><div class="k">${weeks.length}</div><div class="l">Active weeks</div></div></div>
<div class="c"><h2>Next up</h2>${nx?`${fd(nx.d)} · ${tm(nx)} · <b>${lab(nx)}</b> ${nx.r?'· '+nx.r:''}`:'No upcoming sessions.'}</div>
<div class="c"><h2>Hours by weekday</h2>${bars(['Mon','Tue','Wed','Thu','Fri'].map((n,i)=>[n,wd[i]]),Math.max(...wd))}</div>
<div class="c"><h2>Hours per week</h2>${bars(wh,Math.max(...wh.map(w=>w[1])))}</div>
<div class="c"><h2>Hours by subject</h2>${bars(sg.map(o=>[o.k,o.min,col(o.k)]),sg[0].min)}</div>`}
function week(){const w=weeks[st.wk],days=[0,1,2,3,4].map(i=>add(w,i));
const nv=`<div class="ctl"><button class="b" onclick="st.wk=Math.max(0,st.wk-1);go()">←</button><select onchange="st.wk=+this.value;go()">${weeks.map((x,i)=>`<option value="${i}" ${i==st.wk?'selected':''}>Week of ${fd(x,{day:'numeric',month:'short'})}</option>`).join('')}</select><button class="b" onclick="st.wk=Math.min(weeks.length-1,st.wk+1);go()">→</button><span class="mu">${hh(D.filter(x=>mon(x.d)==w).reduce((s,x)=>s+x.dur,0))} of class</span></div>`;
let hrs='';for(let h=8;h<=20;h++)hrs+=`<div class="hr" style="top:${(h-8)*56}px">${h}:00</div>`;
const cols=days.map(d=>`<div>${D.filter(x=>x.d==d&&!x.ad).map(x=>`<div class="ev" style="top:${(x.s-480)*56/60}px;height:${Math.max(x.dur*56/60-2,18)}px;background:${col(x.sub)}"><b>${x.sub}</b><br>${H(x.s)}–${H(x.e)} ${x.r}</div>`).join('')}</div>`).join('');
const ad=D.filter(x=>x.ad&&days.includes(x.d)).map(x=>`<span class="tag" style="background:${col(x.sub)}">${fd(x.d)}: ${x.sub}</span>`).join(' ');
return nv+`<div class="c ov"><div class="tl"><div class="h"></div>${days.map(d=>`<div class="h">${fd(d)}</div>`).join('')}<div>${hrs}</div>${cols}</div>${ad}</div>`}
function month(){const m=months[st.mo],[y,mm]=m.split('-').map(Number),first=m+'-01',s0=mon(first),cells=[];
for(let i=0;i<42;i++){const d=add(s0,i);cells.push(d)}
const nv=`<div class="ctl"><button class="b" onclick="st.mo=Math.max(0,st.mo-1);st.sel=null;go()">←</button><b>${fd(first,{month:'long',year:'numeric'})}</b><button class="b" onclick="st.mo=Math.min(months.length-1,st.mo+1);st.sel=null;go()">→</button><span class="mu">${hh(D.filter(x=>x.d.startsWith(m)).reduce((s,x)=>s+x.dur,0))} of class</span></div>`;
const hd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="l">${d}</div>`).join('');
const body=cells.slice(0,cells[35].startsWith(m)?42:35).map(d=>{const e=D.filter(x=>x.d==d);return `<div class="cd ${d.startsWith(m)?'':'o'}" onclick="st.sel='${d}';go()" style="${st.sel==d?'border-color:var(--ac)':''}"><b>${+d.slice(8)}</b> <span class="mu">${e.length?hh(e.reduce((s,x)=>s+x.dur,0)):''}</span>${e.map(x=>`<span class="chip" style="background:${col(x.sub)}">${x.sub}</span>`).join('')}</div>`}).join('');
return nv+`<div class="c ov"><div class="cal">${hd}${body}</div></div>`+(st.sel?`<div class="c"><h2>${fd(st.sel,{weekday:'long',day:'numeric',month:'long'})}</h2>${D.some(x=>x.d==st.sel)?list(D.filter(x=>x.d==st.sel)):'Free day'}</div>`:'')}
function gaps(d){const e=D.filter(x=>x.d==d&&!x.ad&&x.s!=null).sort((a,b)=>a.s-b.s),g=[];let c=st.ws;e.forEach(x=>{if(x.s>c)g.push([c,Math.min(x.s,st.we)]);c=Math.max(c,x.e)});if(c<st.we)g.push([c,st.we]);return g.filter(a=>a[1]>a[0])}
function free(){const free=d=>gaps(d).reduce((s,g)=>s+g[1]-g[0],0),tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const rows=weeks.map(w=>{const ds=[0,1,2,3,4].map(i=>add(w,i)),f=ds.map(free);return {w,ds,f,t:f.reduce((a,b)=>a+b,0)}});
const all=rows.flatMap(r=>r.ds.map((d,i)=>({d,f:r.f[i],n:D.filter(x=>x.d==d).length})));
const empty=all.filter(x=>!x.n);const wide=all.flatMap(x=>gaps(x.d).filter(g=>g[1]-g[0]>=st.mg).map(g=>({d:x.d,g}))).sort((a,b)=>(b.g[1]-b.g[0])-(a.g[1]-a.g[0])).slice(0,8);
return `<div class="c ctl"><label>Day starts <input type="time" value="${tm(st.ws)}" onchange="st.ws=cv(this.value);go()"></label><label>ends <input type="time" value="${tm(st.we)}" onchange="st.we=cv(this.value);go()"></label><label>Min gap <select onchange="st.mg=+this.value;go()">${[30,60,90,120].map(v=>`<option value="${v}" ${v==st.mg?'selected':''}>${v} min</option>`).join('')}</select></label></div>
<div class="g"><div class="c"><div class="k">${empty.length}</div><div class="l">Weekdays with no class (in active weeks)</div></div><div class="c"><div class="k">${hh(Math.round(rows.reduce((s,r)=>s+r.t,0)/rows.length))}</div><div class="l">Avg free / week</div></div></div>
<div class="c"><h2>Free hours per day (heatmap)</h2><div class="ov"><table><tr><th>Week</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Total</th></tr>${rows.map(r=>`<tr><td>${fd(r.w,{day:'numeric',month:'short'})}</td>${r.f.map(v=>`<td style="background:color-mix(in srgb,var(--ac) ${Math.round(v/Math.max(1,st.we-st.ws)*70)}%,transparent)">${hh(v)}</td>`).join('')}<td><b>${hh(r.t)}</b></td></tr>`).join('')}</table></div></div>
<div class="c"><h2>Longest free windows (≥ ${st.mg} min)</h2>${wide.map(x=>`<div class="row"><div class="n">${fd(x.d)}</div><div>${H(x.g[0])}–${H(x.g[1])} · ${hh(x.g[1]-x.g[0])}</div></div>`).join('')}</div>
<div class="c"><h2>Fully free weekdays</h2><span class="mu">${empty.map(x=>fd(x.d)).join(' · ')||'None'}</span></div>`}
const cv=v=>{const [a,b]=v.split(':');return +a*60+ +b};
function go(){nav();$('#v').innerHTML=({Overview:overview,Subjects:()=>groupView(group(x=>[x.sub]),'s'),Professors:()=>groupView(group(x=>x.p),'p'),Week:week,Month:month,'Free time':free})[st.tab]()}
go();
</script></body></html>
